[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "vcforge"
version = "0.3.1"
description = "Forge HS256-signed session tokens (VaultCore lab / CTF use)"
authors = [{name = "brawlnic"}]
